    <rect x="210" y="205" width="12" height="24"/>
    <rect x="245" y="205" width="24" height="12"/>

    <rect x="150" y="230" width="12" height="24"/>
    <rect x="175" y="230" width="24" height="12"/>
    <rect x="230" y="230" width="12" height="12"/>
    <rect x="255" y="230" width="24" height="24"/>

    <rect x="80" y="255" width="12" height="24"/>
    <rect x="105" y="255" width="24" height="12"/>
    <rect x="140" y="260" width="24" height="12"/>
    <rect x="270" y="260" width="24" height="12"/>
    <rect x="305" y="255" width="12" height="24"/>
    <rect x="330" y="255" width="12" height="12"/>

    <rect x="80" y="290" width="24" height="12"/>
    <rect x="115" y="290" width="12" height="24"/>
    <rect x="140" y="285" width="24" height="12"/>
    <rect x="255" y="285" width="12" height="12"/>
    <rect x="280" y="290" width="24" height="12"/>
    <rect x="315" y="285" width="24" height="12"/>

    <rect x="80" y="325" width="12" height="12"/>
    <rect x="105" y="325" width="24" height="12"/>
    <rect x="140" y="315" width="12" height="24"/>
    <rect x="255" y="315" width="12" height="24"/>
    <rect x="280" y="325" width="12" height="12"/>
    <rect x="305" y="325" width="36" height="12"/>

    <rect x="80" y="350" width="36" height="12"/>
    <rect x="130" y="350" width="12" height="24"/>
    <rect x="155" y="350" width="24" height="12"/>
    <rect x="190" y="355" width="36" height="12"/>
    <rect x="240" y="350" width="24" height="12"/>
    <rect x="280" y="350" width="24" height="12"/>
    <rect x="315" y="350" width="24" height="24"/>

    <rect x="150" y="380" width="24" height="12"/>
    <rect x="185" y="380" width="12" height="24"/>
    <rect x="210" y="380" width="24" height="12"/>
    <rect x="245" y="380" width="12" height="12"/>
    <rect x="270" y="380" width="12" height="24"/>
    <rect x="295" y="380" width="24" height="12"/>

    <rect x="150" y="410" width="12" height="24"/>
    <rect x="175" y="410" width="24" height="12"/>
    <rect x="210" y="405" width="12" height="12"/>
    <rect x="235" y="410" width="24" height="12"/>
    <rect x="270" y="415" width="36" height="12"/>
    <rect x="320" y="410" width="24" height="12"/>

    <rect x="150" y="435" width="36" height="12"/>
    <rect x="200" y="430" width="24" height="12"/>
    <rect x="235" y="435" width="12" height="12"/>
