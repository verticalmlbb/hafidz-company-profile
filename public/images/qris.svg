  <!-- Footer Instructions -->
  <text x="210" y="495" font-size="11" fill="#1b1c1e" text-anchor="middle" class="bold">
    BCA · MANDIRI · BRI · BNI · BSI · GO-PAY · OVO · DANA · SHOPEEPAY
  </text>
  <text x="210" y="515" font-size="9.5" fill="#75777a" text-anchor="middle" class="regular">
    Buka aplikasi m-Banking atau e-Wallet apapun, pilih menu Scan QRIS
  </text>
  <text x="210" y="530" font-size="8.5" fill="#a0a2a5" text-anchor="middle" class="mono">
    VERIFIKASI SISTEM OTOMATIS TIKET HAFIDZ'S COMPANY
  </text>
