<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121315"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mapBg)"/>
  
  <!-- Streets and Arteries -->
  <g stroke="#343537" stroke-width="8" opacity="0.4">
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="100" y1="0" x2="700" y2="600"/>
    <line x1="700" y1="0" x2="100" y2="600"/>
  </g>
  
  <!-- Main Arterial Road (Rasuna Said) with Crimson Glow -->
  <line x1="400" y1="0" x2="400" y2="600" stroke="#bb0102" stroke-width="12" opacity="0.6"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#ff5545" stroke-width="3" opacity="0.8"/>

  <!-- Secondary Glow Street -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#f85c48" stroke-width="2" opacity="0.5"/>

  <!-- Enterprise Location Pin at Center -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="28" fill="#bb0102" opacity="0.4"/>
    <circle cx="0" cy="0" r="16" fill="#ff5545"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <rect x="250" y="340" width="300" height="70" rx="6" fill="#1f2022" stroke="#ff5545" stroke-width="1.5"/>
  <text x="400" y="368" fill="#e3e2e5" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Menara Cyber 2, Lt. 18</text>
  <text x="400" y="392" fill="#ffb4a9" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Jl. H.R. Rasuna Said, Jakarta Selatan</text>
</svg>
